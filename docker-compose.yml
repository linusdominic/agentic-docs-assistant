services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docs_agent
    ports:
      - "5433:5432" # 5433 on the host, so it does not clash with a local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docs_agent"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/docs_agent
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/health")
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
