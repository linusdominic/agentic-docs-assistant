[project]
name = "docs-agent"
version = "0.1.0"
description = "A LangGraph agent with RAG over pgvector, served by FastAPI and deployable to Cloud Run."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Linus Dominic Nathaniel", email = "51094161+linusdominic@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "fastembed>=0.9.1",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
docs-agent = "docs_agent.main:serve"
docs-agent-ingest = "docs_agent.ingest:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is intentional
